name: generate snake

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:
  push:
    branches: [master]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      # Colors follow the profile SVGs: #0d1526 panel, orange ramp for activity, teal snake.
      - uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            build/snake-raw.svg?color_snake=#14b8a6&color_dots=#131d33,#482d22,#773f1f,#b2571b,#f97316&color_dot_border=#1b2740

      # Total and week dates for the panel labels; if this fails the snake still ships without them.
      - name: Fetch contribution calendar
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          LOGIN: ${{ github.repository_owner }}
        run: >-
          gh api graphql -f login="$LOGIN"
          -f query='query($login:String!){user(login:$login){contributionsCollection{contributionCalendar{totalContributions weeks{firstDay}}}}}'
          > build/calendar.json

      - name: Frame snake in the profile panel
        run: |
          mkdir -p dist
          python3 .github/scripts/frame_snake.py build/snake-raw.svg dist/github-snake.svg build/calendar.json

      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
