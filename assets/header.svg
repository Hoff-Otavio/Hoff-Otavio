<svg xmlns="http://www.w3.org/2000/svg" width="880" height="250" viewBox="0 0 880 250" role="img" aria-labelledby="t d">
  <title id="t">Otávio Hoff</title>
  <desc id="d">Backend engineer, Magento 2 and PHP. Keeping production stores fast, secure and selling.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="1" stop-color="#131f3a"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f97316"/>
      <stop offset="0.55" stop-color="#f59e0b"/>
      <stop offset="1" stop-color="#14b8a6"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#f97316" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#f97316" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="22" height="22" patternUnits="userSpaceOnUse">
      <path d="M22 0H0V22" fill="none" stroke="#1e2b47" stroke-width="1"/>
    </pattern>
    <clipPath id="card"><rect width="880" height="250" rx="18"/></clipPath>
    <style>
      .sans { font-family: -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif; }
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace; }
      .cursor { animation: blink 1.1s steps(1) infinite; }
      @keyframes blink { 50% { opacity: 0; } }
      .float { animation: float 6s ease-in-out infinite; transform-origin: center; }
      @keyframes float { 50% { transform: translateY(-5px); } }
    </style>
  </defs>

  <g clip-path="url(#card)">
    <rect width="880" height="250" fill="url(#bg)"/>
    <rect width="880" height="250" fill="url(#grid)" opacity="0.55"/>
    <circle cx="720" cy="120" r="190" fill="url(#glow)"/>
  </g>
  <rect x="0.5" y="0.5" width="879" height="249" rx="18" fill="none" stroke="#24324f"/>
  <rect x="40" y="0" width="160" height="3" rx="1.5" fill="url(#edge)"/>

  <text x="48" y="62" class="mono" font-size="14" fill="#64748b">~/otavio <tspan fill="#f59e0b">$</tspan> whoami<tspan class="cursor" fill="#f97316"> ▌</tspan></text>
  <text x="46" y="122" class="sans" font-size="50" font-weight="700" fill="#f8fafc" letter-spacing="-0.5">Otávio Hoff</text>
  <text x="48" y="158" class="sans" font-size="20" font-weight="600" fill="#f59e0b">Backend Engineer · Magento 2 / PHP</text>
  <text x="48" y="194" class="sans" font-size="16" fill="#94a3b8">I keep production e-commerce stores fast, secure and selling.</text>

  <!-- marca geométrica própria: cubo isométrico em linhas -->
  <g class="float" transform="translate(700 125)" fill="none" stroke-linejoin="round">
    <path d="M0 -70 L60 -35 L0 0 L-60 -35 Z" stroke="#f97316" stroke-width="2.2"/>
    <path d="M-60 -35 L-60 35 L0 70 L0 0" stroke="#f59e0b" stroke-width="2.2"/>
    <path d="M60 -35 L60 35 L0 70" stroke="#14b8a6" stroke-width="2.2"/>
    <path d="M-30 -52 L30 -17 M30 -52 L-30 -17" stroke="#f97316" stroke-opacity="0.35" stroke-width="1.2"/>
    <path d="M-30 -17 L-30 52 M30 -17 L30 52" stroke="#64748b" stroke-opacity="0.45" stroke-width="1.2"/>
    <circle cx="0" cy="0" r="4" fill="#f8fafc"/>
    <circle cx="0" cy="-70" r="3" fill="#f97316"/>
    <circle cx="60" cy="-35" r="3" fill="#14b8a6"/>
    <circle cx="-60" cy="-35" r="3" fill="#f59e0b"/>
  </g>
</svg>
